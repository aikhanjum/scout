name: CI

on:
  push:
  pull_request:

jobs:
  brain:
    name: Pi service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Clearance audit
        run: python tools/check_audit.py
      - name: Scan matcher vs ground truth
        run: python tools/check_slam.py
      - name: Pose across room shapes
        run: python tools/check_room.py

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mission-control/package-lock.json
      - run: npm ci
      - run: npm run build

  fake-scout:
    name: Fake Scout smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tools/fake-scout ci
      - name: Serves /status
        run: |
          node tools/fake-scout/server.js > fake.log 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:8080/status && exit 0; sleep 1; done
          cat fake.log; exit 1
