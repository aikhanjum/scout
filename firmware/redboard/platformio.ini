; Scout's motor board: SparkFun RedBoard (ATmega328P, Uno-compatible) with a DK Electronics
; motor shield (Adafruit v1 clone). Speaks docs/PROTOCOL.md section 9.
;
;   ../.venv/bin/pio run                          compile, producing .pio/build/uno/firmware.hex
;   ../.venv/bin/pio run -t upload                flash a board on this machine's USB
;   ../.venv/bin/pio device monitor -b 115200     watch it. Type "?" then Enter.
;
; To flash from the Pi instead, copy the .hex there and use avrdude -- see README.md.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
